name: book_review
description: "読んだ本を検索・記録するiOSアプリ。Flutterの設計/アーキテクチャを示す技術デモ。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # 状態管理（Riverpod コード生成 + Hooks）
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.0

  # ルーティング
  go_router: ^17.3.0

  # モデル（不変・シリアライズ）
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ネットワーク
  dio: ^5.7.0

  # ローカルキャッシュ
  shared_preferences: ^2.3.3

  # ユーティリティ
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint（機械的な規約強制。riverpod_lint は analysis_options.yaml の
  # plugins で登録し、flutter analyze から実行される）
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.0

  # コード生成（riverpod / freezed / json_serializable）
  # 2.15 で --delete-conflicting-outputs が廃止されているため、
  # CI の手順と食い違わないよう下限を 2.15 系に揃える。
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.0
  freezed: ^3.2.3
  json_serializable: ^6.9.5

  # テスト
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    # デモモード（APIキー不要）の書籍検索が読む Google Books レスポンス
    - assets/demo/
