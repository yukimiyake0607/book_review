name: book_review
description: "読んだ本を検索・記録するiOSアプリ。Flutterの設計/アーキテクチャを示す技術デモ。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # 状態管理（Riverpod コード生成 + Hooks）
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.6.1

  # ルーティング
  go_router: ^14.6.2

  # モデル（不変・シリアライズ）
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ネットワーク
  dio: ^5.7.0

  # ローカルキャッシュ
  shared_preferences: ^2.3.3

  # ユーティリティ
  intl: ^0.20.2
  # retrofit_generator 9.7.0 は retrofit ^4.6.0（Parser.DartMappable 追加前）を前提とするため固定。
  # 4.9.x に上げると generator 側の switch 網羅性エラーで build_runner が壊れる。
  retrofit: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint（機械的な規約強制）
  flutter_lints: ^5.0.0
  # custom_lint は 0.7.5 に固定（builder/core の版ずれでプラグイン起動が失敗するため）。
  custom_lint: 0.7.5
  riverpod_lint: ^2.6.5

  # コード生成（riverpod / freezed / json_serializable）
  # freezed は 3.1.0 に固定（3.2.x は analyzer 9=Dart 3.12+ を要求するため）。
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.5
  freezed: 3.1.0
  json_serializable: ^6.9.5

  # テスト
  mocktail: ^1.0.4
  retrofit_generator: 9.7.0

# Dart 3.11 系で riverpod_generator を動かすための整合。
# analyzer を 7.6.0 に固定することで、custom_lint 0.7.5 → analyzer_plugin 0.13 系
# （analyzer 7.4.5+ と互換）が選択され、build_runner のビルドスクリプトが正常にコンパイルできる。
# （7.7.0 以上や analyzer_plugin 0.12 系だと非互換で壊れる）
dependency_overrides:
  analyzer: 7.6.0
  # analyzer_plugin は 0.13.4（analyzer 7.5+ 向けAPI）に固定。
  # 既定では 0.13.11（analyzer 8=Dart 3.12+ 向け）が選ばれ、build_runner のビルドスクリプトが
  # analyzer 7.6 に対してコンパイルできず壊れるため。
  analyzer_plugin: 0.13.4
  # custom_lint_visitor も analyzer 7.4.5〜7.7.0 向けの版に固定（既定は analyzer 9 向けの +9.0.0）。
  custom_lint_visitor: 1.0.0+7.7.0
  # dart_style は analyzer 7.x 向けの 3.1.1 に固定（既定は analyzer 13+ 前提の 3.1.12 で、
  # custom_lint プラグインの起動時コンパイルが analyzer 7.6 に対して失敗するため）。
  dart_style: 3.1.1

flutter:
  uses-material-design: true
