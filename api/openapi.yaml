openapi: 3.0.3
info:
  title: Book Review API
  version: 1.0.0
  description: |
    読書レビュー管理アプリのバックエンドAPI仕様。
    この仕様が唯一の情報源（Single Source of Truth）であり、
    Dart クライアントはここから生成し、開発時は Prism でモックする。
    バックエンド本体の実装はこのリポジトリのスコープ外。

servers:
  - url: http://localhost:4010
    description: Prism mock server（`npx @stoplight/prism-cli mock api/openapi.yaml`）
  - url: https://api.example.com
    description: 本番（未実装。スキーマ整合の参考用）

tags:
  - name: books
    description: 書籍検索（外部書籍データベースのプロキシを想定）
  - name: reviews
    description: レビューのCRUD同期

paths:
  /books:
    get:
      tags: [books]
      summary: 書籍をキーワード検索する
      operationId: searchBooks
      parameters:
        - name: q
          in: query
          required: true
          description: 検索キーワード（タイトル・著者名など）
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /reviews:
    get:
      tags: [reviews]
      summary: レビュー一覧を取得する（新着順）
      operationId: listReviews
      responses:
        '200':
          description: レビュー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      tags: [reviews]
      summary: レビューを新規作成する
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: 作成されたレビュー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'

  /reviews/{id}:
    get:
      tags: [reviews]
      summary: レビュー詳細を取得する
      operationId: getReview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: レビュー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [reviews]
      summary: レビューを更新する
      operationId: updateReview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '200':
          description: 更新されたレビュー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [reviews]
      summary: レビューを削除する
      operationId: deleteReview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功（本文なし）
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Book:
      type: object
      required: [id, title, authors]
      properties:
        id:
          type: string
          description: 書籍の一意ID（外部DB由来）
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        thumbnailUrl:
          type: string
          format: uri
          nullable: true

    BookSearchResponse:
      type: object
      required: [items, page, hasNextPage]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          type: integer
        hasNextPage:
          type: boolean

    Review:
      type: object
      required: [id, bookId, bookTitle, rating, createdAt, updatedAt]
      properties:
        id:
          type: string
        bookId:
          type: string
        bookTitle:
          type: string
          description: 一覧表示のために書籍名を非正規化して保持する
        bookThumbnailUrl:
          type: string
          format: uri
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        finishedOn:
          type: string
          format: date
          nullable: true
          description: 読了日（YYYY-MM-DD）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewInput:
      type: object
      required: [bookId, bookTitle, rating]
      properties:
        bookId:
          type: string
        bookTitle:
          type: string
        bookThumbnailUrl:
          type: string
          format: uri
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        finishedOn:
          type: string
          format: date
          nullable: true

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: リソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
