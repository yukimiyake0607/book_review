name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで実行中のワークフローがあればキャンセルして最新のみ実行する
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: analyze / format / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter は mise.toml を単一の真実として導入する。
      # ローカル（開発機）と CI で同一の Flutter 3.41.7 / Dart 3.11.5 を保証し、
      # バージョンのドリフトを防ぐ（subosito のハードコードを廃止）。
      - name: Setup toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: flutter pub get

      # 生成物（*.g.dart / *.freezed.dart）はコミットしないため CI で再生成する
      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      # Riverpod 固有の規約は custom_lint（riverpod_lint）で検査する
      - name: Riverpod lint
        run: dart run custom_lint

      # 生成物は git 管理外なので、git ls-files で対象を絞りフォーマット差分を検査する
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Run tests
        run: flutter test

      - name: Build (Android, debug)
        run: flutter build apk --debug --target lib/main_dev.dart
