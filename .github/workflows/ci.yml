name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで実行中のワークフローがあればキャンセルして最新のみ実行する
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: analyze / format / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 生成物（*.g.dart / *.freezed.dart）はコミットしないため CI で再生成する（ADR-0006）
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # 生成物は git 管理外なので、git ls-files で対象を絞りフォーマット差分を検査する
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Run tests
        run: flutter test

      - name: Build (Android, debug)
        run: flutter build apk --debug --target lib/main_dev.dart
